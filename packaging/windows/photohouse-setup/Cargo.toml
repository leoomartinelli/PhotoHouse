[package]
name = "photohouse-setup"
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"

# Independent packaging tool: no dependency on the editor or its WASM build.
[workspace]

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
image = { version = "=0.25.10", default-features = false, features = ["gif", "png", "ico"] }
tempfile = "=3.27.0"

[build-dependencies]
winresource = "=0.1.31"

[profile.release]
opt-level = 2
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

