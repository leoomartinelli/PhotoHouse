<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PhotoHouse — estudo da tela de carregamento</title>
  <style>
    body{margin:0;background:#151613;color:#eef0e8;font-family:Roboto,Arial,sans-serif}
    main.preview-page{max-width:780px;margin:24px auto;padding:0 8px}
    .btn{font:inherit;background:transparent;color:inherit;border:1px solid #42463a;border-radius:6px;padding:8px 12px;cursor:pointer}.btn:focus-visible{outline:2px solid #BFFE00;outline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  </style>
</head>
<body>
  <main class="preview-page">
<div id="ph-loading-preview" class="viz-dotted-background">
  <div class="ph-window" aria-label="PhotoHouse — proposta de tela de carregamento">
    <header class="ph-header"><span class="ph-brand">photo<span>house</span></span></header>
    <main class="ph-content">
      <section class="ph-loading" aria-label="Animação de carregamento">
        <div class="ph-number" aria-hidden="true"><span class="ph-value">000</span><span class="ph-percent">%</span></div>
        <div class="ph-track" role="progressbar" aria-label="Carregamento demonstrativo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="ph-fill"></div></div>
      </section>
      <section class="ph-mascot" aria-label="Arte base do futuro GIF do Housinho">
        <img class="ph-art" src="assets/housinho-base.webp" alt="Housinho inteiro em composição vertical, sorrindo e fazendo sinal de positivo, com pinceladas coloridas ao fundo" width="912" height="1055">
      </section>
    </main>
  </div>
  <div class="ph-preview-controls"><span>ESTUDO VISUAL · ARTE BASE DO GIF</span><button type="button" class="btn btn-ghost ph-replay">Repetir animação</button><span class="sr-only ph-announcement" aria-live="polite"></span></div>
</div>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;800&display=swap');
#ph-loading-preview{padding:30px 22px 18px;max-width:780px;margin:0 auto;box-sizing:border-box}
#ph-loading-preview .ph-window{--ph-green:#bffe00;--ph-black:#070807;--ph-ink:#f1f2ed;--ph-secondary:#93978a;--ph-muted:#777b70;background:var(--ph-black);color:var(--ph-ink);border:1px solid var(--ph-green);border-radius:24px;overflow:hidden;font-family:'Roboto',Arial,sans-serif;box-shadow:0 0 3px #bffe00cc,0 0 14px #bffe0066,0 0 30px #bffe0033,inset 0 0 12px #bffe000c;padding-bottom:0;position:relative}
#ph-loading-preview .ph-header{position:absolute;top:28px;left:32px;display:flex;align-items:center;gap:20px;padding:0;z-index:1}
#ph-loading-preview .ph-brand{font-size:24px;font-weight:800;letter-spacing:-1.3px;white-space:nowrap}
#ph-loading-preview .ph-brand>span{color:var(--ph-green)}
#ph-loading-preview .ph-track{height:2px;background:#252820;overflow:hidden}
#ph-loading-preview .ph-content{display:grid;grid-template-columns:minmax(0,42.37fr) minmax(0,57.63fr);aspect-ratio:3/2;gap:0;margin:0;align-items:center}
#ph-loading-preview .ph-loading{padding:32px;min-width:0;box-sizing:border-box}
#ph-loading-preview .ph-number{display:flex;align-items:flex-start;justify-content:space-between;gap:9px;margin:25px 0 23px;white-space:nowrap;width:100%}
#ph-loading-preview .ph-value{display:inline-block;flex:none;font-size:var(--ph-number-size,clamp(70px,16.3vw,130px));line-height:.85;font-weight:800;letter-spacing:-8px;font-variant-numeric:tabular-nums}
#ph-loading-preview .ph-percent{flex:none;color:var(--ph-green);font-size:35px;line-height:1;font-weight:400;margin-left:0;margin-top:-3px}
#ph-loading-preview .ph-fill{height:100%;width:0;background:var(--ph-green)}
#ph-loading-preview .ph-mascot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;height:100%;padding:0;background:#e7e7e7}
#ph-loading-preview .ph-art{display:block;width:100%;height:100%;object-fit:contain;border:0;border-radius:0}
#ph-loading-preview .ph-preview-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
#ph-loading-preview .ph-preview-controls>span:first-child{font:10px/1.5 'Roboto',Arial,sans-serif;opacity:.65;letter-spacing:.5px}
@media(max-width:540px){#ph-loading-preview .ph-header{top:24px;left:22px}#ph-loading-preview .ph-content{grid-template-columns:1fr;aspect-ratio:auto}#ph-loading-preview .ph-loading{padding:82px 22px 32px}#ph-loading-preview .ph-percent{font-size:35px}#ph-loading-preview .ph-mascot{height:auto;padding:0}#ph-loading-preview .ph-art{height:auto}}
</style>
<script>
(()=>{
 const root=document.getElementById('ph-loading-preview');
 const value=root.querySelector('.ph-value'), fill=root.querySelector('.ph-fill'), progress=root.querySelector('.ph-track'), announcement=root.querySelector('.ph-announcement');
 const settings={duration:10,radius:24};
 const number=root.querySelector('.ph-number'), percent=root.querySelector('.ph-percent');
 function fitNumber(){
   const available=number.clientWidth-percent.getBoundingClientRect().width-9;
   if(available<=0)return;
   const canvas=document.createElement('canvas'), context=canvas.getContext('2d');
   if(!context)return;
   context.font='800 100px Roboto, Arial, sans-serif';
   const width=context.measureText('100').width;
   if(width>0)value.style.setProperty('--ph-number-size',((available+24)*100/width)+'px');
 }
 new ResizeObserver(fitNumber).observe(number);
 fitNumber();
 if(document.fonts)document.fonts.ready.then(fitNumber);
 let start=performance.now(), frame;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function draw(n){value.textContent=String(n).padStart(3,'0');fill.style.width=n+'%';progress.setAttribute('aria-valuenow',String(n));}
 function animate(now){const t=Math.min(1,(now-start)/(settings.duration*1000));const p=Math.round(100*(1-Math.pow(1-t,1.35)));draw(p);if(t<1)frame=requestAnimationFrame(animate);else announcement.textContent='Demonstração concluída.';}
 function replay(){cancelAnimationFrame(frame);start=performance.now();announcement.textContent='Demonstração iniciada.';if(reduced){draw(100);announcement.textContent='Demonstração concluída em modo de movimento reduzido.';}else{draw(0);frame=requestAnimationFrame(animate);}}
 root.querySelector('.ph-replay').addEventListener('click',replay);
 function style(){root.querySelector('.ph-window').style.borderRadius=settings.radius+'px';}
 style();replay();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:style});tweak.addSlider(settings,'duration',{label:'Duração do preview',min:4,max:20,unit:'s'});tweak.addSlider(settings,'radius',{label:'Cantos da janela',min:0,max:40,unit:'px'});}
})();
</script>



  </main>
</body>
</html>
