      .sombra { fill: #000; transform-box: fill-box; transform-origin: 50% 50%; }
      .corpo, .olho { transform-box: fill-box; }
      .corpo { transform-origin: 50% 100%; }
      .olho { transform-origin: 50% 50%; animation: piscar 5.3s infinite; }
      @keyframes piscar {
        0%, 38%, 42%, 79%, 81.5%, 84%, 100% { transform: scaleY(1); }
        40%, 80.5%, 83% { transform: scaleY(0.06); }
      }
      @keyframes flutuar {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-70px) rotate(-1.5deg); }
        50% { transform: translateY(-120px) rotate(0deg); }
        75% { transform: translateY(-60px) rotate(1.5deg); }
      }
      @keyframes sombra-flutuar {
        0%, 100% { transform: scaleX(1); opacity: 0.22; }
        50% { transform: scaleX(0.8); opacity: 0.12; }
      }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

      .corpo { animation: flutuar 3.2s ease-in-out infinite; }
      .sombra { animation: sombra-flutuar 3.2s ease-in-out infinite; }
      .olhos { animation: olhar-fino 6s ease-in-out infinite; }
      .olho { animation: fino 6s ease-in-out infinite; }
      @keyframes fino {
        0%, 8% { transform: scaleY(1); }
        14%, 46% { transform: scaleY(0.32); }
        49% { transform: scaleY(0.06); }
        52%, 84% { transform: scaleY(0.32); }
        92%, 100% { transform: scaleY(1); }
      }
      @keyframes olhar-fino {
        0%, 14% { transform: translate(0, 0); }
        30%, 44% { transform: translate(-60px, 20px); }
        60%, 76% { transform: translate(60px, 10px); }
        90%, 100% { transform: translate(0, 0); }
      }
    </style>
